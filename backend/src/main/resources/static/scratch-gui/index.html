<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratch 3.0 Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f5f5f5; }
    .scratch-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .scratch-header {
      height: 48px;
      background: linear-gradient(90deg, #4c97ff 0%, #855cd6 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: white;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }
    .scratch-header .logo {
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .scratch-header .logo-icon {
      width: 32px;
      height: 32px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .scratch-header .actions {
      display: flex;
      gap: 8px;
    }
    .scratch-header button {
      padding: 6px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    .scratch-header button:hover { opacity: 0.9; }
    .btn-primary { background: #ff8c1a; color: white; }
    .btn-secondary { background: rgba(255,255,255,0.2); color: white; }
    .scratch-workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .blocks-panel {
      width: 280px;
      background: white;
      border-right: 1px solid #e4e7ed;
      display: flex;
      flex-direction: column;
    }
    .blocks-tabs {
      display: flex;
      background: #f5f5f5;
      border-bottom: 1px solid #e4e7ed;
    }
    .blocks-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      font-size: 12px;
      color: #606266;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .blocks-tab:hover { color: #4c97ff; }
    .blocks-tab.active {
      color: #4c97ff;
      border-bottom-color: #4c97ff;
      background: white;
    }
    .blocks-content {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
    }
    .block-category {
      margin-bottom: 8px;
      border-radius: 8px;
      overflow: hidden;
    }
    .block-category-header {
      padding: 8px 12px;
      color: white;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .block-category-header .icon { font-size: 14px; }
    .block-items {
      padding: 8px;
      background: #f8f9fa;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .block-item {
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      color: white;
      cursor: grab;
      user-select: none;
    }
    .block-item:active { cursor: grabbing; }
    .stage-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #f5f5f5;
    }
    .stage-toolbar {
      height: 40px;
      background: white;
      border-bottom: 1px solid #e4e7ed;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
    }
    .stage-toolbar button {
      padding: 4px 12px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .stage-toolbar button:hover { background: #f5f7fa; }
    .stage-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .stage-canvas {
      width: 480px;
      height: 360px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .stage-canvas .cat {
      font-size: 80px;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    .stage-info {
      position: absolute;
      bottom: 8px;
      left: 8px;
      font-size: 11px;
      color: #909399;
    }
    .sprite-panel {
      width: 200px;
      background: white;
      border-left: 1px solid #e4e7ed;
      display: flex;
      flex-direction: column;
    }
    .sprite-header {
      padding: 12px;
      border-bottom: 1px solid #e4e7ed;
      font-size: 14px;
      font-weight: 500;
      color: #303133;
    }
    .sprite-list {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
    }
    .sprite-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 4px;
    }
    .sprite-item:hover { background: #f5f7fa; }
    .sprite-item.active { background: #ecf5ff; }
    .sprite-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #4c97ff 0%, #855cd6 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .sprite-name {
      font-size: 13px;
      color: #303133;
    }
    .status-bar {
      height: 32px;
      background: white;
      border-top: 1px solid #e4e7ed;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 12px;
      color: #909399;
      gap: 16px;
    }
    .color-motion { background: #4c97ff; }
    .color-looks { background: #96f; }
    .color-sound { background: #cf63cf; }
    .color-events { background: #ffbf00; }
    .color-control { background: #ffab19; }
    .color-sensing { background: #5cb1d6; }
    .color-operators { background: #59c059; }
    .color-variables { background: #ff8c1a; }
  </style>
</head>
<body>
  <div class="scratch-container">
    <div class="scratch-header">
      <div class="logo">
        <div class="logo-icon">🐱</div>
        <span>Scratch 3.0</span>
      </div>
      <div class="actions">
        <button class="btn-secondary" onclick="postToParent('PROJECT_SAVED', {projectJson: 'test'})" id="saveBtn">💾 保存</button>
        <button class="btn-primary" onclick="toggleRun()" id="runBtn">▶ 运行</button>
      </div>
    </div>
    
    <div class="scratch-workspace">
      <div class="blocks-panel">
        <div class="blocks-tabs">
          <div class="blocks-tab active" onclick="switchTab(this, 'code')">代码</div>
          <div class="blocks-tab" onclick="switchTab(this, 'costumes')">造型</div>
          <div class="blocks-tab" onclick="switchTab(this, 'sounds')">声音</div>
        </div>
        <div class="blocks-content" id="blocksContent">
          <div class="block-category">
            <div class="block-category-header color-motion">
              <span class="icon">🏃</span> 运动
            </div>
            <div class="block-items">
              <div class="block-item color-motion">移动10步</div>
              <div class="block-item color-motion">右转15度</div>
              <div class="block-item color-motion">左转15度</div>
              <div class="block-item color-motion">移到随机位置</div>
            </div>
          </div>
          <div class="block-category">
            <div class="block-category-header color-looks">
              <span class="icon">👁</span> 外观
            </div>
            <div class="block-items">
              <div class="block-item color-looks">说你好！2秒</div>
              <div class="block-item color-looks">说你好！</div>
              <div class="block-item color-looks">思考嗯...2秒</div>
              <div class="block-item color-looks">下一个造型</div>
            </div>
          </div>
          <div class="block-category">
            <div class="block-category-header color-events">
              <span class="icon">⚡</span> 事件
            </div>
            <div class="block-items">
              <div class="block-item color-events">当绿旗被点击</div>
              <div class="block-item color-events">当按下空格键</div>
              <div class="block-item color-events">当角色被点击</div>
            </div>
          </div>
          <div class="block-category">
            <div class="block-category-header color-control">
              <span class="icon">🔄</span> 控制
            </div>
            <div class="block-items">
              <div class="block-item color-control">等待1秒</div>
              <div class="block-item color-control">重复执行10次</div>
              <div class="block-item color-control">如果...那么</div>
              <div class="block-item color-control">重复执行</div>
            </div>
          </div>
          <div class="block-category">
            <div class="block-category-header color-sensing">
              <span class="icon">👆</span> 侦测
            </div>
            <div class="block-items">
              <div class="block-item color-sensing">碰到鼠标指针？</div>
              <div class="block-item color-sensing">碰到颜色？</div>
              <div class="block-item color-sensing">到鼠标的距离</div>
            </div>
          </div>
          <div class="block-category">
            <div class="block-category-header color-operators">
              <span class="icon">➕</span> 运算
            </div>
            <div class="block-items">
              <div class="block-item color-operators">+</div>
              <div class="block-item color-operators">-</div>
              <div class="block-item color-operators">×</div>
              <div class="block-item color-operators">÷</div>
              <div class="block-item color-operators">随机数</div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="stage-panel">
        <div class="stage-toolbar">
          <button onclick="toggleRun()">▶ 运行</button>
          <button onclick="stopProject()">⏹ 停止</button>
          <button onclick="exportProject()">📥 导出</button>
          <span style="flex:1"></span>
          <span id="statusText">就绪</span>
        </div>
        <div class="stage-area">
          <div class="stage-canvas">
            <div class="cat" id="stageCat">🐱</div>
            <div class="stage-info">Scratch 3.0 演示模式</div>
          </div>
        </div>
        <div class="status-bar">
          <span>📐 480 x 360</span>
          <span>🎭 2 个角色</span>
          <span>🔊 1 个声音</span>
          <span id="saveStatus"></span>
        </div>
      </div>
      
      <div class="sprite-panel">
        <div class="sprite-header">角色</div>
        <div class="sprite-list">
          <div class="sprite-item active">
            <div class="sprite-icon">🐱</div>
            <div class="sprite-name">小猫</div>
          </div>
          <div class="sprite-item">
            <div class="sprite-icon">🐶</div>
            <div class="sprite-name">小狗</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==================== postMessage 桥接 ====================
    function postToParent(type, payload) {
      try {
        window.parent.postMessage({ type: type, payload: payload }, '*');
      } catch (e) { console.error(e); }
    }

    // 通知父页面已就绪
    window.addEventListener('load', function() {
      setTimeout(function() {
        postToParent('READY', { success: true });
      }, 500);
    });

    // 监听父页面消息
    window.addEventListener('message', function(event) {
      if (!event.data || !event.data.type) return;
      
      switch (event.data.type) {
        case 'INIT':
          postToParent('READY', { success: true });
          break;
        case 'RUN_PROJECT':
          toggleRun();
          postToParent('RUN_STARTED', {});
          break;
        case 'STOP_PROJECT':
          stopProject();
          postToParent('RUN_STOPPED', {});
          break;
        case 'SAVE_PROJECT':
          saveProject();
          break;
        case 'GET_PROJECT_DATA':
          postToParent('PROJECT_DATA', {
            projectJson: btoa(JSON.stringify({version: 3, targets: []})),
            timestamp: Date.now()
          });
          break;
        case 'LOCK_EDITOR':
          document.body.style.pointerEvents = event.data.payload.locked ? 'none' : 'auto';
          break;
      }
    });

    // ==================== 功能函数 ====================
    var isRunning = false;
    var runInterval = null;

    function toggleRun() {
      var btn = document.getElementById('runBtn');
      var cat = document.getElementById('stageCat');
      var status = document.getElementById('statusText');
      
      if (isRunning) {
        stopProject();
        return;
      }
      
      isRunning = true;
      btn.textContent = '⏹ 停止';
      btn.className = 'btn-secondary';
      status.textContent = '运行中...';
      
      var pos = 0;
      runInterval = setInterval(function() {
        pos += 2;
        cat.style.transform = 'translateX(' + pos + 'px)';
        if (pos > 200) pos = -200;
      }, 50);
    }

    function stopProject() {
      isRunning = false;
      var btn = document.getElementById('runBtn');
      var cat = document.getElementById('stageCat');
      var status = document.getElementById('statusText');
      
      btn.textContent = '▶ 运行';
      btn.className = 'btn-primary';
      status.textContent = '已停止';
      cat.style.transform = '';
      
      if (runInterval) {
        clearInterval(runInterval);
        runInterval = null;
      }
    }

    function saveProject() {
      var status = document.getElementById('saveStatus');
      status.textContent = '💾 已保存 ' + new Date().toLocaleTimeString();
      postToParent('PROJECT_SAVED', {
        projectJson: btoa(JSON.stringify({version: 3, targets: [], timestamp: Date.now()})),
        timestamp: Date.now()
      });
    }

    function exportProject() {
      postToParent('PROJECT_DATA', {
        projectJson: btoa(JSON.stringify({version: 3, targets: []})),
        timestamp: Date.now()
      });
    }

    function switchTab(el, tab) {
      document.querySelectorAll('.blocks-tab').forEach(function(t) { t.classList.remove('active'); });
      el.classList.add('active');
    }
  </script>
</body>
</html>
