# Magao后端项目 - 开发环境配置
# 用于本地开发，连接localhost各中间件服务

# RabbitMQ 消息队列（本地开发环境暂未安装 RabbitMQ，设为 false 跳过 MQ 相关 Bean）
mq:
  enabled: false

spring:
  # 数据源配置 - MySQL 8
  datasource:
    # 数据库连接URL
    url: jdbc:mysql://localhost:3306/magao_platform?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    # 数据库用户名
    username: root
    # 数据库密码
    password: root123456
    # 数据库驱动类名
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP连接池配置
    hikari:
      # 最小空闲连接数
      minimum-idle: 5
      # 最大连接数
      maximum-pool-size: 20
      # 连接超时时间（毫秒）
      connection-timeout: 30000
      # 空闲连接存活时间（毫秒）
      idle-timeout: 600000
      # 连接最大存活时间（毫秒）
      max-lifetime: 1800000
      # 连接测试查询
      connection-test-query: SELECT 1

  # Redis配置 - Redis 7
  data:
    redis:
      # Redis服务地址
      host: localhost
      # Redis服务端口
      port: 6379
      # Redis密码（无密码则留空）
      password:
      # 使用的数据库索引（0-15）
      database: 0
      # 连接超时时间（毫秒）
      timeout: 5000
      # Lettuce连接池配置
      lettuce:
        pool:
          # 最大连接数
          max-active: 20
          # 最大空闲连接数
          max-idle: 10
          # 最小空闲连接数
          min-idle: 5
          # 连接分配等待时间（毫秒）
          max-wait: 3000

  # RabbitMQ配置
  rabbitmq:
    # RabbitMQ服务地址
    host: localhost
    # RabbitMQ服务端口
    port: 5672
    # 用户名
    username: guest
    # 密码
    password: guest
    # 虚拟主机
    virtual-host: /
    # 发布确认
    publisher-confirm-type: correlated
    # 发布返回
    publisher-returns: true
    # 消费者手动确认
    listener:
      simple:
        acknowledge-mode: manual
        # 预取数量
        prefetch: 10
        # 重试机制
        retry:
          # 是否开启重试
          enabled: true
          # 最大重试次数
          max-attempts: 3
          # 重试间隔（毫秒）
          initial-interval: 1000

# MinIO开发环境配置
minio:
  enabled: true
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  default-bucket: magao

# 本地开发：关闭 TOS（火山引擎），改用本地 MinIO 作为对象存储
tos:
  enabled: false

# Judge0开发环境配置
judge0:
  api-url: http://localhost:2358
  api-key: your-judge0-api-key
  timeout: 30
