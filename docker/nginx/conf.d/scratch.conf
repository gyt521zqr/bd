# ============================================================================
# Magao Platform - Scratch 编辑器静态资源托管配置（方案2）
# ============================================================================
# 通过 Nginx 直接托管 scratch-gui / scratch-jr 编译后的静态文件
# 无需 Docker 容器，无需独立服务，仅靠 Nginx 托管
# ============================================================================

# ----------------------------------------------------------------------
# Scratch GUI 3.0 静态托管
# 静态文件存放路径：/data/static/scratch-gui/
# 访问路径：/scratch-gui/index.html
# ----------------------------------------------------------------------
location /scratch-gui/ {
    alias /data/static/scratch-gui/;
    index index.html;
    try_files $uri $uri/ /scratch-gui/index.html;

    # CORS 头（允许 iframe 跨域加载）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
}

# Scratch GUI JS/CSS 长期缓存
location ~* ^/scratch-gui/.*\.(js|css)$ {
    alias /data/static/scratch-gui/;
    rewrite ^/scratch-gui/(.*)$ /$1 break;
    root /data/static;

    # 带 hash 文件名，可安全缓存1年
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Vary Accept-Encoding;
}

# Scratch GUI 图片和字体资源缓存
location ~* ^/scratch-gui/.*\.(png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|eot|otf|mp3|wav|ogg)$ {
    alias /data/static/scratch-gui/;
    rewrite ^/scratch-gui/(.*)$ /$1 break;
    root /data/static;

    # 素材资源长期缓存（30天）
    expires 30d;
    add_header Cache-Control "public";
    add_header Vary Accept-Encoding;

    # 禁用 gzip 对已压缩的音频文件
    gzip off;
}

# Scratch GUI HTML 文件（不缓存）
location ~* ^/scratch-gui/.*\.html$ {
    alias /data/static/scratch-gui/;
    rewrite ^/scratch-gui/(.*)$ /$1 break;
    root /data/static;

    # HTML 不缓存，确保获取最新版本
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
}

# ----------------------------------------------------------------------
# Scratch Jr 静态托管
# 静态文件存放路径：/data/static/scratch-jr/
# 访问路径：/scratch-jr/index.html
