# ============================================================================
# Magao Platform - 生产环境 Nginx 主站点配置（方案2：对标 52coding 线上架构）
# ============================================================================
# 部署路径：/etc/nginx/conf.d/production.conf
# 功能：
#   1. 主站 Vue 前端 SPA（/data/frontend/dist）
#   2. Scratch GUI 3.0 静态托管（/data/static/scratch-gui/）
#   3. Scratch Jr 静态托管（/data/static/scratch-jr/）
#   4. 后端 API 反向代理（/api/ -> backend:8080）
#   5. WebSocket / SSE 代理
#   6. MinIO 对象存储代理
# ============================================================================

server {
    listen 80;
    # 请替换为你的实际域名
    server_name your-domain.com www.your-domain.com localhost _;

    # ========================================================================
    # 字符集 & 安全头
    # ========================================================================
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ========================================================================
    # 1. 主站 Vue 前端资源（SPA 模式）
    # 路径：/data/frontend/dist
    # ========================================================================
    location / {
        root /data/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # HTML 不缓存（确保获取最新版本）
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }
    }

    # ========================================================================
    # 2. Scratch GUI 3.0 静态托管（核心：对标 52coding /scratch-gui/ 规则）
    # 静态文件存放：/data/static/scratch-gui/
    # 访问路径：/scratch-gui/index.html
    # ========================================================================
    location /scratch-gui/ {
        alias /data/static/scratch-gui/;
        index index.html;
        try_files $uri $uri/ =404;

        # 静态资源长缓存，降低服务器压力
        expires 7d;
        add_header Cache-Control "public";

        # CORS 头（允许同域 iframe 加载）
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    # Scratch GUI JS/CSS 长期缓存（带 hash 文件名可安全缓存1年）
    location ~* ^/scratch-gui/.*\.(js|css)$ {
        alias /data/static/scratch-gui/;
        rewrite ^/scratch-gui/(.*)$ /$1 break;

        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        access_log off;
    }

    # Scratch GUI 图片和字体资源缓存
    location ~* ^/scratch-gui/.*\.(png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|eot|otf|mp3|wav|ogg)$ {
        alias /data/static/scratch-gui/;
        rewrite ^/scratch-gui/(.*)$ /$1 break;

        expires 30d;
        add_header Cache-Control "public";
        add_header Vary Accept-Encoding;
        access_log off;
        gzip off;
    }

    # Scratch GUI HTML 文件（不缓存）
    location ~* ^/scratch-gui/.*\.html$ {
        alias /data/static/scratch-gui/;
        rewrite ^/scratch-gui/(.*)$ /$1 break;

        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ========================================================================
    # 3. Scratch Jr 静态托管
    # 静态文件存放：/data/static/scratch-jr/
    # 访问路径：/scratch-jr/index.html
    # ========================================================================
    location /scratch-jr/ {
        alias /data/static/scratch-jr/;
        index index.html;
        try_files $uri $uri/ =404;

        expires 7d;
        add_header Cache-Control "public";

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    # Scratch Jr JS/CSS 长期缓存
    location ~* ^/scratch-jr/.*\.(js|css)$ {
        alias /data/static/scratch-jr/;
        rewrite ^/scratch-jr/(.*)$ /$1 break;

        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        access_log off;
    }

    # Scratch Jr 图片和字体资源缓存
    location ~* ^/scratch-jr/.*\.(png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|eot|otf)$ {
        alias /data/static/scratch-jr/;
        rewrite ^/scratch-jr/(.*)$ /$1 break;

        expires 30d;
        add_header Cache-Control "public";
        add_header Vary Accept-Encoding;
        access_log off;
        gzip off;
    }

    # Scratch Jr HTML 文件（不缓存）
    location ~* ^/scratch-jr/.*\.html$ {
        alias /data/static/scratch-jr/;
        rewrite ^/scratch-jr/(.*)$ /$1 break;

        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ========================================================================
    # 4. 后端 API 反向代理（/api/ -> backend:8080）
    # ========================================================================
    location /api/ {
        proxy_pass http://backend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        proxy_buffering on;
        proxy_buffer_size 64k;
        proxy_buffers 4 64k;
        proxy_busy_buffers_size 128k;

        client_max_body_size 100m;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ========================================================================
    # 5. WebSocket 代理（用于实时通知、考试监控等）
    # ========================================================================
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ========================================================================
    # 6. SSE（Server-Sent Events）代理
    # ========================================================================
    location /sse/ {
        proxy_pass http://backend:8080/sse/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    # ========================================================================
    # 7. Actuator 健康检查（仅内网访问）
    # ========================================================================
    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        allow 172.28.0.0/16;
        allow 127.0.0.1;
        deny all;
    }

    # ========================================================================
    # 8. 前端静态资源缓存策略（主站 dist 内的资源）
    # 注意：这些 location 必须放在 location / 之后，且使用 ^~ 修饰符确保优先匹配
    # ========================================================================
    location ^~ /static/ {
        alias /data/frontend/dist/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        alias /data/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/(?!scratch-gui|scratch-jr|api|ws|sse|actuator|minio).*\.(js|css)$ {
        root /data/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/(?!scratch-gui|scratch-jr|api|ws|sse|actuator|minio).*\.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        root /data/frontend/dist;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/(?!scratch-gui|scratch-jr|api|ws|sse|actuator|minio).*\.(woff2?|ttf|otf|eot)$ {
        root /data/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
        try_files $uri =404;
    }

    # ========================================================================
    # 10. 禁止访问隐藏文件
    # ========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ========================================================================
    # 11. 错误页面
    # ========================================================================
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /data/frontend/dist;
    }
}
