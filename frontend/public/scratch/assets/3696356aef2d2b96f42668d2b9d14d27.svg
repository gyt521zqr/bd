<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="80" height="80" viewBox="0 0 80 80">
  <g transform="translate(10, 10)">
    <!-- Body -->
    <ellipse cx="30" cy="35" rx="20" ry="22" fill="#ff8c00" stroke="#000" stroke-width="1.5"/>
    <!-- Belly -->
    <ellipse cx="30" cy="40" rx="12" ry="15" fill="#ffcc66"/>
    <!-- Head -->
    <circle cx="30" cy="18" r="14" fill="#ff8c00" stroke="#000" stroke-width="1.5"/>
    <!-- Ears -->
    <polygon points="20,8 17,18 25,12" fill="#ff8c00" stroke="#000" stroke-width="1.5"/>
    <polygon points="40,8 43,18 35,12" fill="#ff8c00" stroke="#000" stroke-width="1.5"/>
    <polygon points="22,10 20,16 24,13" fill="#ff69b4" opacity="0.5"/>
    <polygon points="38,10 40,16 36,13" fill="#ff69b4" opacity="0.5"/>
    <!-- Eyes -->
    <ellipse cx="24" cy="17" rx="3" ry="4" fill="#fff" stroke="#000" stroke-width="1"/>
    <ellipse cx="36" cy="17" rx="3" ry="4" fill="#fff" stroke="#000" stroke-width="1"/>
    <circle cx="24" cy="18" r="1.5" fill="#000"/>
    <circle cx="36" cy="18" r="1.5" fill="#000"/>
    <!-- Nose -->
    <path d="M 28,22 L 32,22 L 30,25 Z" fill="#ff69b4" stroke="#000" stroke-width="0.5"/>
    <!-- Mouth -->
    <path d="M 30,25 Q 26,28 24,25" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M 30,25 Q 34,28 36,25" fill="none" stroke="#000" stroke-width="1"/>
    <!-- Whiskers -->
    <line x1="14" y1="20" x2="22" y2="21" stroke="#000" stroke-width="0.5"/>
    <line x1="14" y1="23" x2="22" y2="23" stroke="#000" stroke-width="0.5"/>
    <line x1="38" y1="21" x2="46" y2="20" stroke="#000" stroke-width="0.5"/>
    <line x1="38" y1="23" x2="46" y2="23" stroke="#000" stroke-width="0.5"/>
    <!-- Tail -->
    <path d="M 48,35 Q 60,30 58,18" fill="none" stroke="#ff8c00" stroke-width="6" stroke-linecap="round"/>
    <path d="M 48,35 Q 60,30 58,18" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Legs spread apart (walking pose) -->
    <rect x="14" y="52" width="8" height="10" rx="3" fill="#ff8c00" stroke="#000" stroke-width="1.5" transform="rotate(-15, 18, 55)"/>
    <rect x="38" y="52" width="8" height="10" rx="3" fill="#ff8c00" stroke="#000" stroke-width="1.5" transform="rotate(15, 42, 55)"/>
  </g>
</svg>