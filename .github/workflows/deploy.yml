# ============================================================================
# Magao Platform - CI/CD 工作流（监听 main 分支）
# ============================================================================
# 触发条件:
#   - push 到 main（自动）
#   - 手动在 Actions 页面点击 "Run workflow"（workflow_dispatch）
#
# 执行流程:
#   1) ci    : 在 GitHub Runner 上编译后端(Maven) 与 前端(npm)，作为质量门禁
#   2) deploy: ci 通过后，SSH 登录阿里云 ECS，自动拉取最新代码并重建/重启服务
#
# ----------------------------------------------------------------------------
# 需要先在 GitHub 仓库 Settings -> Secrets and variables -> Actions 配置:
#   DEPLOY_HOST       ECS 公网 IP，如 47.108.207.180
#   DEPLOY_USER       SSH 登录用户名，如 root（或具备 docker/sudo 权限的部署账号）
#   DEPLOY_SSH_KEY    SSH 私钥（建议用专用 deploy key，仅对仓库 read 权限）
#   DEPLOY_PATH       ECS 上仓库根目录绝对路径，如 /opt/magao-platform
#   DEPLOY_DOMAIN     站点域名，如 wukonghuwei.cn（用于前端构建注入 API base url）
#   DEPLOY_PORT       （可选）SSH 端口，默认 22
#
# ECS 主机前置要求（脚本依赖）:
#   - 已 git clone 本仓库到 DEPLOY_PATH，且配置了可拉取代码的凭证(deploy key)
#   - 已安装 docker / docker compose(v2)、node 18+、npm
#   - /data/frontend/dist 目录存在（前端由 nginx 静态托管）
# ============================================================================

name: CI/CD Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 同一分支只允许一个部署在跑，避免并发重建导致服务中断
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # Job 1: CI 质量门禁 —— 编译后端 + 构建前端，确保 push 的代码可正常构建
  # ==========================================================================
  ci:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend (Maven)
        working-directory: backend
        # 与 Dockerfile.backend 保持一致，跳过单测加快构建（如需单测门禁去掉 -DskipTests）
        run: mvn -B -ntp package -DskipTests

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (npm)
        working-directory: frontend
        run: |
          npm ci --registry=https://registry.npmmirror.com
          npm run build

  # ==========================================================================
  # Job 2: 部署到阿里云 ECS —— ci 通过后才执行
  # ==========================================================================
  deploy:
    name: Deploy to ECS
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            # 兼容有无 sudo 的环境
            if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi

            cd "${{ secrets.DEPLOY_PATH }}"

            echo "==> 拉取最新代码"
            git pull origin main

            echo "==> 重建并重启后端（Docker 内 maven 编译 Spring Boot）"
            docker compose -f docker/docker-compose.yml build backend
            docker compose -f docker/docker-compose.yml up -d backend

            echo "==> 重建前端静态资源并同步到 Nginx 托管目录"
            cd frontend
            npm ci --registry=https://registry.npmmirror.com
            VITE_APP_BASE_URL="https://${{ secrets.DEPLOY_DOMAIN }}" npm run build
            $SUDO mkdir -p /data/frontend/dist
            $SUDO rm -rf /data/frontend/dist/*
            $SUDO cp -r dist/* /data/frontend/dist/
            $SUDO chown -R nginx:nginx /data/frontend/dist 2>/dev/null || true

            echo "==> 刷新 Nginx 静态资源"
            docker compose -f docker/docker-compose.yml exec -T nginx nginx -s reload 2>/dev/null || true

            echo "==> 等待后端健康检查"
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
                echo "backend healthy ✔"; break
              fi
              echo "waiting for backend... ($i)"
              sleep 5
            done
            curl -fsS http://localhost:8080/actuator/health && echo "deploy ok" || echo "backend health check timeout (请登录 ECS 查看日志)"
